[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-free-looped-transformer"
version = "0.1.0"
description = "Training-free looped transformer reproduction package and remote-run CLI."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Huang Xutao"}]
dependencies = []

[project.optional-dependencies]
eval = [
  "lm-eval==0.4.11",
  "transformers>=4.51,<4.52",
  "accelerate>=1.0",
  "torch",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tflt = "tflt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
